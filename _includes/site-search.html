<button type="button" class="search-toggle" aria-expanded="false" aria-controls="site-search" aria-label="Ouvrir la recherche">
  <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
  <span class="search-toggle-label">Rechercher</span>
</button>
<div
  class="site-search"
  id="site-search"
  hidden
  data-index="{{ '/recherche-index.json' | relative_url }}"
  data-page="{{ '/recherche/' | relative_url }}"
>
  <form class="site-search-form" role="search" action="{{ '/recherche/' | relative_url }}" method="get">
    <label class="visually-hidden" for="site-search-q">Rechercher sur le site</label>
    <input
      type="search"
      id="site-search-q"
      name="q"
      placeholder="Rechercher un guide, un test, une intégration…"
      autocomplete="off"
      enterkeyhint="search"
      spellcheck="false"
    >
    <button type="submit" class="site-search-go">Rechercher</button>
  </form>
  <p class="site-search-count" id="site-search-count" aria-live="polite"></p>
  <div class="site-search-results" id="site-search-results"></div>
  <p class="site-search-more" id="site-search-more" hidden>
    <a href="{{ '/recherche/' | relative_url }}">Ouvrir la page de recherche</a>
  </p>
</div>
