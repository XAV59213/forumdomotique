# One-shot: decode the retouched Door Sensor photo, then remove itself.
name: Installer la retouche 65 Door Sensor

on:
  push:
    branches: [main]
    paths:
      - "scripts/_pending/65-door-sensor-pose-haut.jpg.b64"
      - "scripts/_pending/65-door-sensor-pose-haut.webp.b64"
      - ".github/workflows/installer-retouche-65.yml"

permissions:
  contents: write

jobs:
  install:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.head_commit && !contains(github.event.head_commit.message, '[install-65]')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Décoder les images, nettoyer et publier
        run: |
          python3 << 'PY'
          import base64
          import sys
          from pathlib import Path

          dest_dir = Path("contenus/tests/test-nuki-smart-lock-pro-5-installation-usages/images")
          src_dir = Path("scripts/_pending")
          dest_dir.mkdir(parents=True, exist_ok=True)
          for name in ("65-door-sensor-pose-haut.jpg", "65-door-sensor-pose-haut.webp"):
              raw = (src_dir / f"{name}.b64").read_text().strip()
              data = base64.b64decode(raw)
              if name.endswith(".jpg") and not data.startswith(b"\xff\xd8\xff"):
                  sys.exit(f"{name} is not a JPEG")
              if name.endswith(".webp") and not data.startswith(b"RIFF"):
                  sys.exit(f"{name} is not a WebP")
              target = dest_dir / name
              target.write_bytes(data)
              print(name, len(data), "bytes")
          PY
          rm -rf scripts/_pending
          rm -f .github/workflows/installer-retouche-65.yml
          git add -A "contenus/tests/test-nuki-smart-lock-pro-5-installation-usages/images/65-door-sensor-pose-haut.jpg" \
                  "contenus/tests/test-nuki-smart-lock-pro-5-installation-usages/images/65-door-sensor-pose-haut.webp"
          git add -u scripts/_pending .github/workflows/installer-retouche-65.yml || true
          git config user.name "XAV59213"
          git config user.email "153436936+XAV59213@users.noreply.github.com"
          git commit -m "$(cat <<'EOF'
Retoucher le joint PVC et les traces autour de l’angle sur la photo du Door Sensor en haut de la fenêtre. [install-65]

Le capteur, l’aimant, le store et le cadrage restent inchangés.
EOF
)"
          git pull --rebase --autostash origin main
          git push
