# Crée ou met à jour sujets/<slug>/index.md (redirection vers messages.html)
# quand un sujet est archivé. Les commits portent le marqueur [index-sujets]
# pour éviter une boucle.
name: Index des sujets

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "sujets/**/messages.md"
      - "scripts/generer-index-sujets.py"
      - ".github/workflows/generer-index-sujets.yml"

permissions:
  contents: write

concurrency:
  group: generer-index-sujets
  cancel-in-progress: false

jobs:
  index:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.head_commit && !contains(github.event.head_commit.message, '[index-sujets]')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer PyYAML
        run: python -m pip install "pyyaml>=6"

      - name: Générer les index de redirection
        run: python scripts/generer-index-sujets.py

      - name: Publier les index s'ils ont changé
        run: |
          git add sujets/*/index.md
          if git diff --cached --quiet; then
            echo "Aucun changement d'index."
            exit 0
          fi
          git config user.name "XAV59213"
          git config user.email "153436936+XAV59213@users.noreply.github.com"
          git commit -m "Générer les index de redirection des sujets archivés [index-sujets]"
          git pull --rebase --autostash origin main
          git push
