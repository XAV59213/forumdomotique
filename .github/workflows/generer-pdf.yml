# Régénère les PDF des guides, tests produits et intégrations.
# Déclenché à la main, ou quand un article / le script change.
# Les commits de PDF portent le marqueur [pdf] pour éviter une boucle.
name: Générer les PDF

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "contenus/guides/**/*.md"
      - "contenus/tests/**/*.md"
      - "sujets/**/messages.md"
      - "contenus/**/images/**"
      - "sujets/**/images/**"
      - "_data/integrations.yml"
      - "guides.md"
      - "scripts/generer-pdf.py"
      - "scripts/requirements-pdf.txt"
      - ".github/workflows/generer-pdf.yml"

permissions:
  contents: write

concurrency:
  group: generer-pdf
  cancel-in-progress: true

jobs:
  pdf:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.head_commit && !contains(github.event.head_commit.message, '[pdf]')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: |
          python -m pip install -r scripts/requirements-pdf.txt

      - name: Générer les PDF
        run: python scripts/generer-pdf.py

      - name: Publier les PDF s'ils ont changé
        run: |
          git add -A "contenus/**/*.pdf" "sujets/**/*.pdf"
          git add -u "contenus/**/*.md" "sujets/**/*.md"
          if git diff --cached --quiet; then
            echo "Aucun changement de PDF."
            exit 0
          fi
          git config user.name "XAV59213"
          git config user.email "153436936+XAV59213@users.noreply.github.com"
          git commit -m "Régénérer les PDF des guides, tests et intégrations [pdf]"
          git pull --rebase --autostash origin main
          git push
