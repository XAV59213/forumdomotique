theme: jekyll-theme-cayman
lang: fr
locale: fr_FR
title: XAV59213 — Forum Domotique
tagline: Mes intégrations et tests HA
description: >-
  Moi c’est XAV59213. Je partage mes intégrations Home Assistant (HACS),
  tests, guides et actualités sur Forum Domotique : Freebox, chauffage,
  SMS, piscine.
url: https://xav59213.github.io
baseurl: /forumdomotique
show_downloads: false
license: Tous droits réservés
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge
plugins:
  - jekyll-seo-tag
  # sitemap.xml est généré par le fichier maison (avec lastmod).
  # jekyll-sitemap n’est plus chargé pour éviter un conflit de permalink.
  - jekyll-relative-links
relative_links:
  enabled: true
  collections: true
# Le flux Atom complet est généré par feed.xml (jekyll-feed n’est pas
# utilisé : il produisait un /feed-posts.xml vide, faute de dossier _posts/).
author:
  name: XAV59213
  url: https://forumdomotique.com/profile/106-xav59213/
social:
  name: XAV59213
  links:
    - https://github.com/XAV59213
    - https://forumdomotique.com/profile/106-xav59213/
logo: /assets/images/logo-xav.png
# Pas de compte X renseigné : on n’émet pas twitter.username
# (un username vide produisait twitter:site="@" et un créateur incorrect).
# Après vérification Search Console / Bing, décommenter et coller les codes :
# webmaster_verifications:
#   google: "COLLEZ_ICI_LE_CODE_GOOGLE"
#   bing: "COLLEZ_ICI_LE_CODE_BING"
exclude:
  - inventaire.json
  - .gitignore
  - vendor
  - Gemfile
  - Gemfile.lock
  - seo-modeles
  - scripts
  - "https:"
defaults:
  - scope:
      path: ""
    values:
      layout: default
      image: /assets/images/og-default.png
      lang: fr
      don: false
  - scope:
      path: brouillons
    values:
      sitemap: false
      robots: noindex, nofollow
  - scope:
      path: google2b70f4b4787d43c1.html
    values:
      sitemap: false
      robots: noindex, nofollow
  - scope:
      path: BingSiteAuth.xml
    values:
      sitemap: false

  - scope:
      path: sujets/489-integrer-resmed-myair-cpap-dans-home-assistant/sujet-489.pdf
    values:
      sitemap: false
  - scope:
      path: sujets/620-connecter-son-imprimante-3d-a-home-assistant-avec-octoprint-sur-raspberry-pi-mon/sujet-620.pdf
    values:
      sitemap: false
  - scope:
      path: sujets/4008-guide-utilisateur-freebox-homexa-de-linstallation-a-lutilisation-v28824/guide-freebox-homexa-v28824.pdf
    values:
      sitemap: false
  # Ne pas afficher les commentaires repris du forum sous les tests et les guides.
  # Une régénération du bot Forum Domotique peut les réécrire dans l’article :
  # le layout les masque tant que cette valeur reste false.
  - scope:
      path: contenus/tests
    values:
      forum_comments: false
      don: true
  - scope:
      path: contenus/guides
    values:
      forum_comments: false
      don: true
  - scope:
      path: creations
    values:
      forum_comments: false
      don: true
  - scope:
