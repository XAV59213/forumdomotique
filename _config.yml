theme: jekyll-theme-cayman
lang: fr
locale: fr_FR
title: XAV59213 — Forum Domotique
tagline: Intégrations et tests HA
description: >-
  Intégrations Home Assistant (HACS), tests produits, guides et actualités
  de Xavier Descamps (XAV59213) sur Forum Domotique : Freebox, chauffage,
  SMS, piscine.
url: https://xav59213.github.io
baseurl: /forumdomotique
show_downloads: false
license: Tous droits réservés
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-relative-links
relative_links:
  enabled: true
  collections: true
# jekyll-feed n’indexe que les fichiers de _posts/ ; le flux Atom
# complet des articles est généré dans feed.xml (voir ci-dessous).
feed:
  path: /feed-posts.xml
  title: XAV59213 — Forum Domotique
author:
  name: Xavier Descamps (XAV59213)
  url: https://forumdomotique.com/profile/106-xav59213/
social:
  name: Xavier Descamps
  links:
    - https://github.com/XAV59213
    - https://forumdomotique.com/profile/106-xav59213/
logo: /assets/images/og-default.png
# Pas de compte X renseigné : on n’émet pas twitter.username
# (un username vide produisait twitter:site="@" et un créateur incorrect).
# Après vérification Search Console / Bing, décommenter et coller les codes :
# webmaster_verifications:
#   google: "COLLEZ_ICI_LE_CODE_GOOGLE"
#   bing: "COLLEZ_ICI_LE_CODE_BING"
exclude:
  - inventaire.json
  - .gitignore
  - vendor
  - Gemfile
  - Gemfile.lock
  - seo-modeles
defaults:
  - scope:
      path: ""
    values:
      layout: default
      image: /assets/images/og-default.png
      lang: fr_FR
  - scope:
      path: brouillons
    values:
      sitemap: false
      robots: noindex, nofollow
