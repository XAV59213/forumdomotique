- v: "2026.4.1"
  date: 2026-04-03
  date_fr: "3 avril 2026"
  fixes: 28
  summary: "Deux jours après la 2026.4, des correctifs pour Matter, Sonos, Tesla Fleet et Tuya, un changement non rétrocompatible pour SMHI et des libellés d’actions harmonisés."
  notable:
    - i: "Matter"
      t: "Mode « off » des chauffe-eau corrigé ; le pourcentage des ventilateurs peut être vide en mode Auto."
    - i: "Sonos"
      t: "État correct quand le titre est vide, et interrupteurs d’alarme créés même si l’enceinte était hors ligne au démarrage."
    - i: "SMHI"
      t: "Correctif signalé comme non rétrocompatible : vérifiez vos entités météo SMHI."
    - i: "Tuya"
      t: "Unités corrigées pour les capteurs d’énergie."
    - i: "Conditions"
      t: "Sélecteur d’état de la condition « select » corrigé."
    - i: "Tesla Fleet, Proxmox VE, Transmission, Fritz"
      t: "Gestion des autorisations OAuth, faux positif sur l’état des sauvegardes, suppression du capteur de redirection de port, migration des identifiants d’images."
- v: "2026.4.2"
  date: 2026-04-11
  date_fr: "11 avril 2026"
  fixes: 68
  summary: "La grosse corrective d’avril (68 changements, dont 30 mises à jour de bibliothèques). Elle fiabilise notamment le chiffrement des sauvegardes, MQTT, Tibber, Proxmox VE et Victron BLE."
  notable:
    - i: "Sauvegardes"
      t: "Calcul de taille corrigé lors du chiffrement d’une sauvegarde (bibliothèque securetar mise à jour)."
    - i: "MQTT"
      t: "Initialisation du mode couleur des lumières au schéma JSON corrigée."
    - i: "Tibber"
      t: "Coordinateur de prix amélioré et premier état du capteur de prix corrigé."
    - i: "Proxmox VE"
      t: "Une migration ne force plus de réauthentification ; gestion des permissions améliorée."
    - i: "Victron BLE"
      t: "Fausses demandes de réauthentification et erreurs de stockage corrigées."
    - i: "Ring"
      t: "Annulation du correctif des instantanés introduit dans la 2026.4.1."
    - i: "Backblaze B2, FRITZ!Box Tools, Miele, BSB-LAN, Alexa Devices"
      t: "Erreurs mieux gérées et journalisées, état des interrupteurs d’accès internet, température à cœur, configuration sans eau chaude, suppression des appareils obsolètes."
- v: "2026.4.3"
  date: 2026-04-17
  date_fr: "17 avril 2026"
  fixes: 27
  summary: "Une corrective qui règle notamment une fuite de mémoire des satellites vocaux Wyoming et un appel bloquant dans VoIP, deux bugs qui peuvent ralentir toute l’instance."
  notable:
    - i: "Wyoming"
      t: "Fuite de mémoire corrigée lors de la déconnexion d’un satellite."
    - i: "VoIP"
      t: "Suppression d’un appel bloquant dans la boucle principale."
    - i: "ESPHome"
      t: "Relecture correcte de la température de couleur blanc froid/chaud."
    - i: "MQTT"
      t: "Les entités découvertes mais désactivées ne sont plus supprimées."
    - i: "Template"
      t: "Retrait de la classe d’appareil des capteurs binaires template corrigé."
    - i: "Proxmox VE, OpenEVSE, Tuya, Growatt, SwitchBot"
      t: "Plantage sur l’occupation du stockage, unités de courant et de puissance, unité kWh manquante, capteurs de puissance SPH, détection de sonnette du Keypad Vision."
- v: "2026.4.4"
  date: 2026-04-24
  date_fr: "24 avril 2026"
  fixes: 15
  summary: "Dernière corrective d’avril, avec deux durcissements de sécurité autour des comptes limités au réseau local, et des correctifs pour Kodi, MQTT et Roborock."
  security:
    - "La propriété « local uniquement » (local_only) d’un utilisateur est désormais vérifiée pendant l’authentification WebSocket."
    - "Elle est aussi vérifiée pour les requêtes signées."
  notable:
    - i: "Kodi"
      t: "La navigation dans les médias fonctionne de nouveau."
    - i: "MQTT"
      t: "Les lumières JSON ne restaurent plus un mode couleur vide au démarrage."
    - i: "Roborock"
      t: "Validation de la vitesse d’aspiration et meilleure gestion des erreurs."
    - i: "Tractive"
      t: "Interrogation de l’API ralentie pour éviter les erreurs 429 (trop de requêtes)."
    - i: "Google Generative AI, Victron BLE, Gardena, IMAP"
      t: "Vérification du type MIME de la synthèse vocale, fausses réauthentifications, classe d’appareil de l’eau, connexion IMAP perdue mieux gérée."
